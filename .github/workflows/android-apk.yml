name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 找到安卓工程
        run: |
          if [ -f settings.gradle ]; then
            DIR="."
          else
            ZIP=$(ls *.zip 2>/dev/null | head -n1)
            if [ -z "$ZIP" ]; then echo "没有找到 settings.gradle，也没有 zip 文件"; exit 1; fi
            mkdir -p _src && unzip -q -o "$ZIP" -d _src
            DIR=$(dirname "$(find _src -name settings.gradle | head -n1)")
          fi
          echo "安卓工程目录：$DIR"
          ls -la "$DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: 构建 APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/EVA-tea.apk"

      - name: 保存 APK
        uses: actions/upload-artifact@v4
        with:
          name: EVA-tea-apk
          path: EVA-tea.apk

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: EVA茶研所 v${{ github.run_number }}
          files: EVA-tea.apk
